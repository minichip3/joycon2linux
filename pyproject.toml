[project]
name = "joycon2linux"
version = "0.1.0"
description = "Joy-Con 2 and Switch 2 Pro Controller bridge for Linux via BLE GATT"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
dependencies = [
    "evdev>=1.7.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
j2l = "j2l.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
